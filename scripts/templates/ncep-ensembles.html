<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEFS / AIGEFS 集合图</title><style>
body{margin:0;background:#f4f7fa;color:#42586e;font:14px Arial,sans-serif}main{max-width:1280px;margin:auto;padding:18px}.controls,nav{display:flex;flex-wrap:wrap;gap:12px;align-items:end}label{display:grid;gap:6px;min-width:0}select,a{padding:8px;border:1px solid #d1dce5;border-radius:6px;background:white;color:#327fa4}nav{margin:14px 0}figure{margin:0;overflow:auto;background:white}img{display:block;width:100%;height:auto}#error{color:#b24032}.status,small{line-height:1.8}select{max-width:100%}@media(max-width:600px){label{flex:1 1 42%}main{padding:9px}}
</style></head><body><main><h1>GEFS / AIGEFS 集合预报</h1><div class="controls"><label>模型<select id="model"><option>GEFS</option><option>AIGEFS</option></select></label><label>实际起报UTC<select id="run"></select></label><label>产品<select id="product"><option value="region">洋区轨迹</option><option value="track">系统成员轨迹</option><option value="wind">风速kt</option><option value="pressure">气压hPa</option></select></label><label id="region-label">洋区<select id="region"></select></label><label id="storm-label">原始系统编号<select id="storm"></select></label></div><p id="status" class="status">读取清单…</p><nav><a id="png">下载PNG</a><a id="csv">原始CSV</a><a id="data">来源JSON</a><a href="https://tropical-tidbits-material.pages.dev/">返回主站</a></nav><p id="error" role="alert"></p><figure><img id="chart" alt="已发布的NCEP集合图" hidden></figure><small>Workflow只产PNG；不下载GRIB。31成员含0号控制。均线至少8/31；genesis及场L不等于已判定热带气旋，场10m风不替代持续风VMAX。</small></main><script type="module">
const $=id=>document.getElementById(id),query=new URLSearchParams(location.search);let manifest,expected='';
function safe(path,r){if(typeof path!=='string'||!r.assets.includes(path)||!path.startsWith('runs/'+r.model+'/'+r.run.replace(/[-:]/g,'')+'/')||!/^runs\/(GEFS|AIGEFS)\/20\d{6}T(00|06|12|18)0000Z\/(regions\/(world|wp|ep|al|ni|si|sp)\.png|storms\/(AL|EP|CP|WP|IO|AA|BB|SH|SP|SI)\d{2}20\d{2}-(track|wind|pressure)\.png|native\.csv|source\.json)$/.test(path))throw Error('发布路径无效');return path}
function options(id,items,value){$(id).replaceChildren(...items.map(([v,l])=>new Option(l,v)));if(value!==undefined)$(id).value=value}
function hide(){expected='';$('chart').hidden=true;$('chart').removeAttribute('src');for(const id of['png','csv','data'])$(id).removeAttribute('href')}
function render(){hide();$('error').textContent='';try{const r=manifest.records.find(r=>r.model===$('model').value&&r.run===$('run').value);if(!r)throw Error('所选模型／起报尚未发布，不借其他时次代替');const regional=$('product').value==='region';$('region-label').hidden=!regional;$('storm-label').hidden=regional;const item=regional?r.regions.find(v=>v.id===$('region').value):r.storms.find(v=>v.id===$('storm').value)?.[$('product').value];if(!item)throw Error('所选系统／产品尚未发布');const path=safe(item.png,r);$('png').href=path;$('png').download=path.split('/').pop();$('csv').href=safe(r.csv,r);$('data').href=safe(r.data,r);expected=new URL(path,location.href).href;$('chart').src=path;$('status').textContent=`${r.model} ${r.run} · +0–${r.horizonHours}h · tracker ${r.trackerMembers}/31 · ${r.model==='GEFS'?'genesis '+r.genesisMembers+'/31':'场L '+r.derived.status+' '+r.derived.fields+'/1271'} · 产图 ${r.generatedAt}`}catch(e){$('error').textContent=e.message}}
function modelChanged(){const records=manifest.records.filter(r=>r.model===$('model').value).sort((a,b)=>b.run.localeCompare(a.run));options('run',records.map(r=>[r.run,r.run]));runChanged()}
function runChanged(){const r=manifest.records.find(r=>r.model===$('model').value&&r.run===$('run').value);options('region',(r?.regions??[]).map(v=>[v.id,v.label]),'wp');options('storm',(r?.storms??[]).map(v=>[v.id,v.id]),query.get('storm')??'WP292026');render()}
$('chart').onload=()=>{if($('chart').currentSrc===expected)$('chart').hidden=false};$('chart').onerror=()=>{$('chart').hidden=true;$('error').textContent='此图未能加载，不显示其他图替代'};
$('model').onchange=modelChanged;$('run').onchange=runChanged;for(const id of['product','region','storm'])$(id).onchange=render;
try{const r=await fetch('index.json',{credentials:'omit',redirect:'error',cache:'no-cache'});if(!r.ok)throw Error('发布清单暂不可用');manifest=await r.json();if(manifest.schema!==1||!['ncep-charts-v1','ncep-charts-v2-svgz','ncep-charts-v3-png'].includes(manifest.generator)||!Array.isArray(manifest.records))throw Error('清单无效');$('model').value=query.get('model')??'GEFS';modelChanged()}catch(e){hide();$('error').textContent=e.message}
</script></body></html>
