name: Publish GEFS and AIGEFS 31-member hybrid tracks
on:
  schedule:
    - cron: '45 4,10,16,22 * * *'
  workflow_dispatch:
    inputs:
      initialization_time:
        description: 'latest, or exact 00/06/12/18 UTC ISO initialization; models remain separate'
        default: latest
        type: string
      models:
        description: 'Generate both ensembles, or repair just one model without substituting the other'
        type: choice
        options: [both, GEFS, AIGEFS]
        default: both
      resume_run_id:
        description: 'Optional completed MAIN run of THIS workflow with compact field-member checkpoints, never native grids'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: ncep-ensemble-track-publication
  cancel-in-progress: false
jobs:
  tracks:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      actions: write
    env:
      REQUESTED_RUN: ${{ inputs.initialization_time || 'latest' }}
      REQUESTED_MODELS: ${{ inputs.models || 'both' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-tracks.txt
      - run: pip install -r scripts/requirements-tracks.txt
      - name: Native ensemble unit suite for subsequent full hybrid jobs
        run: python -m unittest discover -s tests -p 'test_ncep_ensembles.py' -v
      - name: Validate explicit recovery provenance before restoring compact checkpoints
        if: inputs.resume_run_id != ''
        uses: actions/github-script@v7
        env:
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        with:
          script: |
            const id=process.env.RESUME_RUN_ID;
            if(!/^\d{1,12}$/.test(id))throw Error('Invalid recovery run ID');
            const {owner,repo}=context.repo;
            const current=(await github.rest.actions.getWorkflowRun({owner,repo,run_id:context.runId})).data;
            const source=(await github.rest.actions.getWorkflowRun({owner,repo,run_id:Number(id)})).data;
            if(source.workflow_id!==current.workflow_id||source.head_repository?.full_name!==`${owner}/${repo}`||source.head_branch!=='main'||source.status!=='completed'||!['schedule','workflow_dispatch'].includes(source.event))throw Error('Recovery must be this repository MAIN scheduled/manual workflow; no PR/fork or unverified artifacts');
      - uses: actions/download-artifact@v4
        if: inputs.resume_run_id != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}
          name: ncep-ensembles-${{ inputs.resume_run_id }}
          path: .generated-ensembles
      - name: Fetch actual 31-member trackers and GEFS native genesis, never provider means
        run: |
          case "$REQUESTED_MODELS" in
            both) models=(GEFS AIGEFS);;
            GEFS) models=(GEFS);;
            AIGEFS) models=(AIGEFS);;
            *) exit 1;;
          esac
          python scripts/ncep_ensembles.py --models "${models[@]}" --run "$REQUESTED_RUN" --tracker-only
      - name: Publish native tracker phase without claiming AIGEFS field-low availability
        uses: actions/github-script@v7
        with:
          script: |
            await require('./scripts/publish_ncep.cjs')({github,context});
            await github.rest.actions.createWorkflowDispatch({owner:context.repo.owner,repo:context.repo.repo,workflow_id:'ncep-charts.yml',ref:'main',inputs:{skip_tests:'true'}});
      - name: Verify independently served native GRIB headers, member, physical units and UTC
        if: inputs.models != 'GEFS'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.ncep_ensembles import parse_run, grid_fields, closed_lows
          import numpy as np
          payload=json.loads(Path('.generated-ensembles/AIGEFS.json').read_text())
          run=parse_run(payload['run'])
          evidence=[]
          for member in (0,1):
              for hour in (0,6):
                  pressure,wind,lats,lons=grid_fields(run,member,hour,'.ncep-grid-cache')
                  assert np.isfinite(pressure).any() and np.isfinite(wind).any()
                  evidence.append({'member':member,'hour':hour,'run':payload['run'],'shape':list(pressure.shape),
                      'nativePressureUnit':'Pa','displayPressureUnit':'hPa','nativeWindComponentsUnit':'m/s',
                      'pressureRangeHpa':[float(np.nanmin(pressure)),float(np.nanmax(pressure))],
                      'windRangeMs':[float(np.nanmin(wind)),float(np.nanmax(wind))],
                      'closedLCount':len(closed_lows(pressure,wind,lats,lons,hour))})
          Path('.generated-ensembles/native-grib-evidence.json').write_text(json.dumps(evidence))
          print(json.dumps(evidence))
          PY
      - name: Add actual future-born AIGEFS closed field lows, all 31 members through 240h
        if: inputs.models != 'GEFS'
        env:
          RESUME_RUN_ID: ${{ inputs.resume_run_id || '' }}
        run: |
          args=()
          if [ -n "$RESUME_RUN_ID" ]; then args+=(--resume-members); fi
          python scripts/ncep_ensembles.py --models AIGEFS --hybrid-existing "${args[@]}"
      - name: Publish completed or explicitly partial hybrid coverage without replacing native tracker winds
        if: inputs.models != 'GEFS'
        uses: actions/github-script@v7
        with:
          script: |
            await require('./scripts/publish_ncep.cjs')({github,context});
      - name: Preserve compact output and native physical verification only, never raw grids
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncep-ensembles-${{ github.run_id }}
          path: |
            .generated-ensembles/*.json
            .generated-ensembles/field-members/*.json
          include-hidden-files: true
          retention-days: 7
