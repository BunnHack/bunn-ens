name: Generate GEFS and AIGEFS ensemble charts
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Publish GEFS and AIGEFS 31-member hybrid tracks']
    types: [completed]
permissions:
  contents: read
# GitHub Pages is one site: serialize with WM-6 and preserve BOTH chart trees.
concurrency:
  group: wm6-forecast-publication
  cancel-in-progress: false
jobs:
  charts:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || 'https://bunnhack.github.io/bunn-ens/ncep-ensembles/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-forecast.txt
      - run: pip install -r scripts/requirements-forecast.txt
      - name: Test genuine PNG/SVG, units, member counts, means, gaps and missing values
        run: python -m unittest discover -s tests -p 'test_ncep_charts.py' -v
      - name: Restore existing WM-6 charts without any WindBorne API calls
        uses: actions/cache/restore@v4
        with:
          path: .generated-site/forecast-models
          key: wm6-chart-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: wm6-chart-history-
      - name: Restore NCEP chart history separately
        uses: actions/cache/restore@v4
        with:
          path: .generated-site/ncep-ensembles
          key: ncep-chart-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ncep-chart-history-
      - name: Refuse to overwrite the existing forecast site with missing or older WM-6 assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import urllib.request
          import json
          path=Path('.generated-site/forecast-models/index.json')
          if not path.is_file():
              raise SystemExit('Published WM-6 cache missing; preserve live site, do not deploy an NCEP-only replacement')
          with urllib.request.urlopen('https://bunnhack.github.io/bunn-ens/forecast-models/index.json',timeout=30) as response:
              public=response.read(1_000_001)
          if len(public)>1_000_000 or public!=path.read_bytes():
              raise SystemExit('Restored WM-6 manifest differs from live publication; refusing site regression')
          def check(value):
              if isinstance(value,dict):
                  for item in value.values():check(item)
              elif isinstance(value,list):
                  for item in value:check(item)
              elif isinstance(value,str) and value.startswith('runs/'):
                  target=path.parent/value
                  if not target.resolve().is_relative_to(path.parent.resolve()) or not target.is_file():
                      raise SystemExit('Referenced WM-6 chart missing from cache; refusing site regression')
          check(json.loads(public))
          print('Existing WM-6 manifest byte-identical and referenced cached charts complete; no private API request')
          PY
      - name: Inspect native GEFS genesis coverage at an actual data-branch commit
        id: coverage
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const sha=(await github.rest.git.getRef({owner,repo,ref:'heads/ensemble-track-data'})).data.object.sha;
            const commit=(await github.rest.git.getCommit({owner,repo,commit_sha:sha})).data;
            const tree=(await github.rest.git.getTree({owner,repo,tree_sha:commit.tree.sha})).data.tree;
            const file=tree.find(f=>f.path==='GEFS.json');
            if(!file)throw Error('GEFS publication missing; no model substitute');
            const blob=(await github.rest.git.getBlob({owner,repo,file_sha:file.sha})).data;
            const value=JSON.parse(Buffer.from(blob.content,'base64').toString('utf8'));
            if(value.model!=='GEFS'||value.ensembleSize!==31||!/^20\d{2}-\d\d-\d\dT(?:00|06|12|18):00:00Z$/.test(value.run))throw Error('Native GEFS identity invalid');
            core.setOutput('repair',value.members.filter(m=>m.genesis==='available').length!==31?'true':'false');
            core.setOutput('run',value.run);
      - name: Repair only genuinely missing native GEFS genesis, never use AIGEFS or a different run
        if: steps.coverage.outputs.repair == 'true'
        env:
          EXACT_RUN: ${{ steps.coverage.outputs.run }}
        run: python scripts/ncep_ensembles.py --models GEFS --run "$EXACT_RUN" --tracker-only
      - name: Publish repaired small native GEFS data without changing AIGEFS
        if: steps.coverage.outputs.repair == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await require('./scripts/publish_ncep.cjs')({github,context});
      - name: Pin the same exact public data commit for all images and metadata
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            core.setOutput('sha',(await github.rest.git.getRef({owner,repo,ref:'heads/ensemble-track-data'})).data.object.sha);
      - name: Generate actual basin, member-track, conditional-mean and intensity PNG/SVG
        env:
          NCEP_DATA_REF: ${{ steps.source.outputs.sha }}
        run: python scripts/ncep_charts.py --data-ref "$NCEP_DATA_REF"
      - name: Independently decode EVERY PNG and SVG, check all manifest paths and retain no grids
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import xml.etree.ElementTree as ET
          from PIL import Image
          root=Path('.generated-site/ncep-ensembles')
          manifest=json.loads((root/'index.json').read_text())
          assert {r['model'] for r in manifest['records']}=={'GEFS','AIGEFS'}
          count=0
          for record in manifest['records']:
              assert record['ensembleSize']==31
              assert record['horizonHours']==(120 if record['model']=='GEFS' else 240)
              for asset in record['assets']:
                  path=root/asset
                  assert path.is_file() and path.resolve().is_relative_to(root.resolve())
                  if path.suffix=='.png':
                      image=Image.open(path);image.load();assert image.width==2000 and image.height in (1200,1300);count+=1
                  if path.suffix=='.svg':assert ET.parse(path).getroot().tag.endswith('svg')
          assert count==sum(len(r['regions'])+3*len(r['storms']) for r in manifest['records']) and count>=14
          assert not any(p.suffix in ('.grib2','.grb','.nc','.zarr','.zip') for p in root.rglob('*'))
          print(f'{count} genuine 2000px PNGs independently decoded; all standalone SVGs and native CSV/JSON verified')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .generated-site
      - name: Publish both WM-6 and NCEP chart trees together, never overwrite one with the other
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Cache only successfully published NCEP images and compact data
        if: steps.deployment.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .generated-site/ncep-ensembles
          key: ncep-chart-history-${{ github.run_id }}-${{ github.run_attempt }}
