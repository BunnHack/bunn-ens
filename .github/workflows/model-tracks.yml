name: Publish AIGFS low-centre and SD3 tracks
on:
  schedule:
    - cron: '45 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: model-track-publication
  cancel-in-progress: false
jobs:
  tracks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-tracks.txt
      - run: pip install -r scripts/requirements-tracks.txt
      - name: Test native decoding, UTC, closed lows and ambiguous identities
        run: python -m unittest discover -s tests -p 'test_low_tracks.py' -v
      - name: Generate only public-source, validated native or derived tracks
        run: python scripts/low_tracks.py
      - name: Preserve native decoding evidence
        uses: actions/upload-artifact@v4
        with:
          name: model-tracks-${{ github.run_id }}
          path: .generated-tracks/index.json
          retention-days: 7
      - name: Publish small JSON on its own data branch, never overwrite chart Pages
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const branch = 'model-track-data';
            const {owner, repo} = context.repo;
            try { await github.rest.git.getRef({owner,repo,ref:'heads/'+branch}); }
            catch (e) { if(e.status!==404) throw e; await github.rest.git.createRef({owner,repo,ref:'refs/heads/'+branch,sha:context.sha}); }
            let sha;
            try { sha = (await github.rest.repos.getContent({owner,repo,path:'index.json',ref:branch})).data.sha; }
            catch (e) { if(e.status!==404) throw e; }
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path:'index.json',branch,sha,message:'Publish validated AIGFS L-centre and SD3 native tracks',content:fs.readFileSync('.generated-tracks/index.json').toString('base64')});
